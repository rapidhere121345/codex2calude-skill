# Install root:root 0644 at /etc/gemini-mcp-model-policy.conf.
# Replace `auto` with the exact Gemini Pro value reported by the authenticated
# VPS `agy models` command. Choose the highest effort that this account/model
# supports; CLI accepts low|medium|high|max, but the model may expose fewer.
# Until a concrete model is bound, the production gate blocks inference.
GEMINI_PRO_CLI_VALUE=auto
GEMINI_PRO_EFFORT=max
