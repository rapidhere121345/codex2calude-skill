[project]
name = "claude-research-mcp"
version = "0.1.0"
description = "Restricted stdio MCP server for remote Claude Code research calls"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.20.0,<2",
]

[project.scripts]
claude-research-mcp = "claude_research_mcp.server:main"
gemini-research-mcp = "gemini_research_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_research_mcp", "src/gemini_research_mcp"]
